[flake8]
# Configuracao de estilo do Elo Escolar, versionada no repositorio para que a
# mesma regra valha na maquina de quem desenvolve e na pipeline de integracao.

# 100 em vez dos 79 do PEP 8: o Django produz linhas naturalmente longas em
# definicoes de campo, widgets de formulario e consultas encadeadas. Cem e o
# limite que a comunidade Django adota com mais frequencia, e continua sendo
# uma regra real, verificada a cada Pull Request.
max-line-length = 100

# Migracoes sao geradas pelo proprio Django e nao sao escritas a mao.
# O ambiente virtual e a biblioteca de graficos nao sao codigo do projeto.
exclude =
    .git,
    __pycache__,
    */migrations/*,
    venv,
    .venv,
    static/js

# Complexidade ciclomatica: reprova funcao com caminhos demais, que e sinal de
# regra de negocio que deveria estar quebrada em partes menores.
max-complexity = 10

# Nenhuma regra desligada: o conjunto completo do pycodestyle e do pyflakes
# permanece ativo, inclusive F401 (import nao usado) e E501 (linha longa).
