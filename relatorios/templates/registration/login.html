{% extends 'relatorios/base.html' %}

{% block titulo %}Entrar - Elo Escolar{% endblock %}

{% block conteudo %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h1 class="h4 mb-4 text-center">Acessar o sistema</h1>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Usuário ou senha inválidos.
                    </div>
                {% endif %}

                <form method="post" class="form-login">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label" for="{{ form.username.id_for_label }}">Usuário</label>
                        {{ form.username }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="{{ form.password.id_for_label }}">Senha</label>
                        {{ form.password }}
                    </div>

                    <button type="submit" class="btn btn-elo w-100">Entrar</button>
                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
