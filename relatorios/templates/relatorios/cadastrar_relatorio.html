<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar relatório - Elo Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-4" style="max-width: 800px;">
        <h1 class="mb-4 text-dark">Publicar relatório diário</h1>

        <div class="card shadow-sm border-0">
            <div class="card-body">

                <form method="post">
                    {% csrf_token %}

                    {% for campo in form %}
                        <div class="mb-3">
                            <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
                            {{ campo }}
                            {% for erro in campo.errors %}
                                <div class="text-danger small mt-1">{{ erro }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a href="{% url 'lista_relatorios' %}" class="btn btn-secondary">Cancelar</a>
                </form>

            </div>
        </div>
    </div>

</body>
</html>
